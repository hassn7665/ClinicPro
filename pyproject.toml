[project]
name = "my_clinic"
version = "2.7.1"
description = "My Clinic - إدارة العيادة (يعمل بدون إنترنت)"
requires-python = ">=3.10"
# Pillow: ضغط الصور (أطول ضلع 1600 بكسل، JPEG جودة 80) وإنشاء المصغّرات. بدونها تُخزَّن الصور بحجمها الكامل.
# للتحقق بعد التثبيت: «الإعدادات ← تشخيص الجهاز» يجب أن يظهر «معالجة الصور (Pillow) ✓».
dependencies = ["flet==0.28.3", "pillow"]

[tool.flet]
org = "sy.gftu"
product = "My Clinic"
company = "G.F.T.U."
copyright = "Copyright (C) 2026"

# شاشة البدء الأصلية: لون الخلفية يطابق خلفية التطبيق (theme.BG)، والشعار من assets/splash.png و splash_android.png
[tool.flet.splash]
color = "#EFF7F6"
dark_color = "#EFF7F6"

[tool.flet.app]
path = "."
# لا يُحزَم أي سرّ أو أداة مدير داخل الـAPK (CI يفحص الحزمة النهائية أيضاً عبر tools/check_apk.py)
exclude = ["docs", "keygen.py", "admin_keys.json", "admin_keys.json.tmp", "issued_log.json", "issued_log.json.tmp",
           "tests", "tools", ".git", ".github", "myclinic_data", "run_admin.bat", "run_app.bat", "run_tests.bat",
           "upload-keystore.jks", "keystore.jks", "key.properties"]
