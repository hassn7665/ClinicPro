name: Build My Clinic APK

on:
  workflow_dispatch:        # زر تشغيل يدوي من تبويب Actions
  push:
    branches: [main]        # ويعمل أيضاً عند كل رفع جديد
  pull_request:
    branches: [main]        # الاختبارات فقط (لا بناء ولا توقيع)

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  test:
    name: Tests (must pass before build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # تبعيات الاختبار فقط (لا تدخل الـAPK)، مثبّتة بالتجزئات: أي حزمة تتغير أو تُعبَث بها يفشل التثبيت
      - name: Install test dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (pyflakes)
        run: python -m pyflakes .

      - name: Run test suite
        env:
          HYPOTHESIS_PROFILE: ci          # اختبارات الخصائص بنتائج قابلة لإعادة الإنتاج
        run: python tools/run_tests.py

  build:
    needs: test                                  # لا يبدأ البناء ولا التوقيع إلا بعد نجاح كل الاختبارات
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # أسرار التوقيع (Settings → Secrets and variables → Actions). راجع قسم «النشر والتوقيع» في README_AR.md
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # (اختياري لكن موصى به) بصمة SHA-256 لشهادة التوقيع، كمتغير عادي Variables: يفشل البناء إن اختلف المفتاح
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Java (required by Android build)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Release guard (no secrets in repo, public keys present)
        run: python tools/check_release.py

      - name: Prepare signing keystore
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرار التوقيع ناقصة:$missing — بدونها يُوقَّع الـAPK بمفتاح تجريبي يتغيّر كل مرة فلا يقبل أندرويد التحديث فوق النسخة المثبّتة. راجع README_AR.md (النشر والتوقيع)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "✓ keystore صالح وكلمات المرور والـalias صحيحة"

      - name: Install Flet
        run: pip install flet==0.28.3          # نفس الإصدار المقفل في requirements-dev.lock وpyproject.toml

      - name: Generate SVG icons
        run: python make_icons.py

      - name: Build APK (signed, increasing build number)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flet build apk --verbose \
            --build-number "${{ github.run_number }}" \
            --android-signing-key-store "$RUNNER_TEMP/upload-keystore.jks" \
            --android-signing-key-alias "$ANDROID_KEY_ALIAS"

      - name: Verify APK (signature + no admin secrets inside)
        run: |
          python tools/check_apk.py build/apk/*.apk
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner غير موجود على المشغّل؛ تخطّيت التحقق من التوقيع"
          else
            for apk in build/apk/*.apk; do
              "$APKSIGNER" verify --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
              sha=$(grep -i "certificate SHA-256 digest" "$RUNNER_TEMP/cert.txt" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
              echo "بصمة شهادة التوقيع (SHA-256): $sha   ← سجّلها في Variables باسم ANDROID_CERT_SHA256"
              if [ -n "$ANDROID_CERT_SHA256" ] && [ "$sha" != "$(echo "$ANDROID_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')" ]; then
                echo "::error::توقيع الـAPK لا يطابق ANDROID_CERT_SHA256 — لن يقبل أندرويد التحديث. أوقف النشر."
                exit 1
              fi
            done
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: myclinic-apk
          path: build/apk/
          if-no-files-found: error
